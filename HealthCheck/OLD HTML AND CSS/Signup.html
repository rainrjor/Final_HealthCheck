<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
    }

    /* Left side form */
    .left {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f8f8;
    }

    /* Right side image */
    .right {
      width: 50%;
      background: url('assets/Logo.png') no-repeat center center;
      background-size: cover;
      display: flex;
    }

    .signup-box {
      width: 550px;
      padding: 40px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .signup-box h2 {
      margin-bottom: 20px;
      font-size: 22px;
      color: #333;
    }

    .signup-box input,
    .signup-box select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .signup-box button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      color: #fff;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .signup-btn {
      background: #5a67d8;
    }

    .signup-btn:hover {
      background: #4c51bf;
    }

    .login-btn {
      background: #414040;
      margin-top: 10px;
    }

    .login-btn:hover {
      background: #333;
    }

    .social-login p {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    /* Responsive design */
    @media (max-width: 992px) {
      .right {
        display: none;
      }

      .left {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Left: Signup form -->
  <div class="left">
    <div class="signup-box">
      <h2>Create your account</h2>
      <form>
        <input type="text" placeholder="First Name" required>
        <input type="text" placeholder="Last Name" required>
        <input type="text" placeholder="Birthdate" onfocus="(this.type='date')" required>
        <input type="email" placeholder="Email" required>


        <input type="tel" placeholder="Phone Number" required>

        <select required>
          <option value="" disabled selected>Select Sex</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>

        <input type="password" placeholder="Password" required>

        <button type="submit" class="signup-btn">SIGN UP</button>
      </form>

      <div class="social-login">
        <p>Already have an account?</p>
      </div>

      <button type="button" class="login-btn">🔑 LOGIN</button>
    </div>
  </div>

  <!-- Right: Background image -->
  <div class="right">
    <!-- Decorative image or illustration -->
  </div>

</body>

</html>


<script>
  document.addEventListener("DOMContentLoaded", () => {
    const signupForm = document.querySelector("form");
    const firstName = document.querySelector("input[placeholder='First Name']");
    const lastName = document.querySelector("input[placeholder='Last Name']");
    const birthdate = document.querySelector("input[placeholder='Birthdate']");
    const emailInput = document.querySelector("input[type='email']");
    const phoneInput = document.querySelector("input[type='tel']");
    const sexSelect = document.querySelector("select");
    const passwordInput = document.querySelector("input[type='password']");
    const loginBtn = document.querySelector(".login-btn");

    // Handle signup form
    signupForm.addEventListener("submit", function (event) {
      event.preventDefault();

      // Get values
      const fname = firstName.value.trim();
      const lname = lastName.value.trim();
      const birth = birthdate.value.trim();
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();
      const sex = sexSelect.value;
      const password = passwordInput.value.trim();

      // Validate required fields
      if (!fname || !lname || !birth || !email || !phone || !sex || !password) {
        alert("Please fill out all fields.");
        return;
      }

      // Basic email validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert("Please enter a valid email address.");
        return;
      }

      // Phone number check (basic – only digits, min 10 numbers)
      const phonePattern = /^[0-9]{10,15}$/;
      if (!phonePattern.test(phone)) {
        alert("Please enter a valid phone number (10–15 digits).");
        return;
      }

      // Password check
      if (password.length < 8) {
        alert("Password must be at least 8 characters long.");
        return;
      }

      // ✅ If everything is valid, redirect
      window.location.href = "mainv2.html";
    });

    // Handle "Already have an account? LOGIN" button
    loginBtn.addEventListener("click", () => {
      window.location.href = "Login.html"; // replace with your login page filename
    });



  });
</script>
